<!doctype html><html lang="es" translate="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214d3b"><title>Datos bancarios - Hostal Muyuyo</title><link rel="stylesheet" href="../muyuyo-common.css"><style>*{box-sizing:border-box}body{margin:0;color:var(--muyuyo-ink);background:radial-gradient(circle at 18% 0%,rgba(234,220,80,.18),transparent 32rem),radial-gradient(circle at 96% 12%,rgba(49,127,189,.14),transparent 26rem),linear-gradient(180deg,#f7fbf4,#fffdf8 42%,#eef7f0);line-height:1.45}.wrap{width:min(980px,calc(100% - 32px));margin:0 auto;padding:20px 0 68px}.top{position:sticky;top:12px;z-index:10;border:1px solid var(--muyuyo-line);border-radius:var(--muyuyo-radius);background:rgba(255,255,255,.9);box-shadow:var(--muyuyo-shadow);backdrop-filter:blur(16px);padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}.title h1{margin:0;font-size:clamp(1.18rem,2.6vw,1.8rem);line-height:1.1}.title p{margin:6px 0 0;color:var(--muyuyo-muted);font-size:.94rem}.lang-box{display:flex;align-items:center;gap:10px}.lang-box label{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;font-weight:780;color:var(--muyuyo-muted)}.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.tab{-webkit-appearance:none;appearance:none;border:1px solid var(--muyuyo-line);border-radius:var(--muyuyo-radius);padding:14px 16px;cursor:pointer;text-align:left;color:#fff;box-shadow:0 12px 30px rgba(30,49,42,.12);font:inherit;font-weight:800}.tab.active{outline:3px solid rgba(234,220,80,.55);outline-offset:2px}.pacifico{background:linear-gradient(135deg,#155d93,#278dd8)}.pichincha{background:linear-gradient(135deg,#b99711,#eadc50);color:#17211d}.actions{margin-top:14px;border:1px solid var(--muyuyo-line);border-left:6px solid var(--muyuyo-gold);border-radius:var(--muyuyo-radius);background:var(--muyuyo-surface);box-shadow:0 14px 34px rgba(30,49,42,.09);padding:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.hint{color:var(--muyuyo-muted);font-size:.92rem}.whatsapp,.copy{border:1px solid rgba(33,77,59,.18);border-radius:999px;background:#fff;color:var(--muyuyo-forest);padding:10px 14px;font:inherit;font-weight:760;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{border:1px solid var(--muyuyo-line);border-radius:var(--muyuyo-radius);background:rgba(255,255,255,.9);box-shadow:0 14px 36px rgba(30,49,42,.09);padding:18px}.headerLine{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--muyuyo-line);padding-bottom:10px;margin-bottom:8px}.headerLine h2{margin:0;font-size:1.05rem}.badge{font-size:.78rem;color:var(--muyuyo-forest);background:#edf8f1;border:1px solid rgba(33,77,59,.13);border-radius:999px;padding:5px 10px;white-space:nowrap}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(28,48,40,.08)}.row:last-child{border-bottom:0}.k{margin:0;color:var(--muyuyo-muted);font-size:.8rem}.v{margin:2px 0 0;word-break:break-word}.toast{text-align:center;color:var(--muyuyo-muted);font-size:.9rem;margin-top:12px}.pill{display:inline-block;border:1px solid rgba(33,77,59,.16);background:#fff;border-radius:999px;padding:4px 10px;margin-left:6px;color:var(--muyuyo-forest);font-weight:760}@media(max-width:760px){.top,.grid,.tabs{grid-template-columns:1fr}.top{position:static}.lang-box{align-items:stretch;flex-direction:column}.lang-box select,.whatsapp{width:100%}.actions{align-items:stretch}.row{align-items:flex-start;flex-direction:column}.copy{width:100%}}</style></head><body><main class="wrap"><section class="top"><div class="title"><h1 id="title"></h1><p id="sub"></p></div><div class="lang-box"><label for="language-select" id="lang-label"></label><select id="language-select" class="muyuyo-select"><option value="es">Español</option><option value="en">English</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ja">日本語</option><option value="ko">한국어</option></select></div></section><section class="tabs"><button class="tab pacifico active" id="t1" type="button">Banco del Pacifico</button><button class="tab pichincha" id="t2" type="button">Banco del Pichincha</button></section><section class="actions"><div class="hint" id="hint"></div><button class="whatsapp" id="btnAll" type="button"></button></section><section class="grid"><article class="card" id="selectedCard"></article><article class="card" id="allCard"></article></section><div class="toast" id="toast"></div></main><script>const UI={"es":{"title":"Datos bancarios para transferencia","sub":"Selecciona el banco para ver o copiar los datos. Tambien puedes copiar ambas cuentas en formato WhatsApp.","lang":"Idioma","all":"Copiar todo (WhatsApp)","hint":"Copia ambas cuentas en varias lineas.","selected":"Cuenta seleccionada","available":"Cuentas disponibles","accounts":"2 cuentas","type":"Tipo de cuenta","holder":"Titular","number":"Numero de cuenta","email":"Email","copy":"Copiar","copied":"Copiado","toast":"Copiado:","waTitle":"Datos para transferencia","account":"Cuenta"},"en":{"title":"Bank details for transfer","sub":"Select a bank to view or copy the details. You can also copy both accounts in WhatsApp format.","lang":"Language","all":"Copy all (WhatsApp)","hint":"Copy both accounts in multiple lines.","selected":"Selected account","available":"Available accounts","accounts":"2 accounts","type":"Account type","holder":"Account holder","number":"Account number","email":"Email","copy":"Copy","copied":"Copied","toast":"Copied:","waTitle":"Transfer details","account":"Account"},"fr":{"title":"Coordonnees bancaires pour virement","sub":"Selectionnez une banque pour voir ou copier les donnees. Vous pouvez aussi copier les deux comptes au format WhatsApp.","lang":"Langue","all":"Tout copier (WhatsApp)","hint":"Copie les deux comptes sur plusieurs lignes.","selected":"Compte selectionne","available":"Comptes disponibles","accounts":"2 comptes","type":"Type de compte","holder":"Titulaire","number":"Numero de compte","email":"Email","copy":"Copier","copied":"Copie","toast":"Copie:","waTitle":"Donnees pour virement","account":"Compte"},"de":{"title":"Bankdaten fuer Ueberweisung","sub":"Waehlen Sie eine Bank aus, um die Daten anzusehen oder zu kopieren. Sie koennen auch beide Konten im WhatsApp-Format kopieren.","lang":"Sprache","all":"Alles kopieren (WhatsApp)","hint":"Kopiert beide Konten in mehreren Zeilen.","selected":"Ausgewaehltes Konto","available":"Verfuegbare Konten","accounts":"2 Konten","type":"Kontotyp","holder":"Kontoinhaber","number":"Kontonummer","email":"Email","copy":"Kopieren","copied":"Kopiert","toast":"Kopiert:","waTitle":"Daten fuer Ueberweisung","account":"Konto"},"pt":{"title":"Dados bancarios para transferencia","sub":"Selecione o banco para ver ou copiar os dados. Tambem pode copiar as duas contas em formato WhatsApp.","lang":"Idioma","all":"Copiar tudo (WhatsApp)","hint":"Copia as duas contas em varias linhas.","selected":"Conta selecionada","available":"Contas disponiveis","accounts":"2 contas","type":"Tipo de conta","holder":"Titular","number":"Numero da conta","email":"Email","copy":"Copiar","copied":"Copiado","toast":"Copiado:","waTitle":"Dados para transferencia","account":"Conta"},"ja":{"title":"送金用の銀行情報","sub":"銀行を選んで詳細を確認またはコピーできます。2つの口座情報をWhatsApp形式でまとめてコピーすることもできます。","lang":"言語","all":"すべてコピー (WhatsApp)","hint":"2つの口座情報を複数行でコピーします。","selected":"選択中の口座","available":"利用可能な口座","accounts":"2口座","type":"口座の種類","holder":"名義人","number":"口座番号","email":"Email","copy":"コピー","copied":"コピー済み","toast":"コピー済み:","waTitle":"送金情報","account":"口座"},"ko":{"title":"송금용 은행 정보","sub":"은행을 선택해 정보를 확인하거나 복사할 수 있습니다. 두 계좌 정보를 WhatsApp 형식으로 한 번에 복사할 수도 있습니다.","lang":"언어","all":"모두 복사 (WhatsApp)","hint":"두 계좌 정보를 여러 줄로 복사합니다.","selected":"선택한 계좌","available":"사용 가능한 계좌","accounts":"2개 계좌","type":"계좌 종류","holder":"예금주","number":"계좌 번호","email":"Email","copy":"복사","copied":"복사됨","toast":"복사됨:","waTitle":"송금 정보","account":"계좌"}};const ACCOUNTS={"1":{"bank":"Banco del Pacifico","type":{"es":"Cuenta de Ahorros","en":"Savings account","fr":"Compte epargne","de":"Sparkonto","pt":"Conta poupanca","ja":"普通預金口座","ko":"저축 계좌"},"holder":"Alexandra Guerrero Valle","number":"5327377","email":"mymuyuyo@gmail.com"},"2":{"bank":"Banco del Pichincha","type":{"es":"Cuenta Corriente","en":"Checking account","fr":"Compte courant","de":"Girokonto","pt":"Conta corrente","ja":"当座預金口座","ko":"당좌 계좌"},"holder":"Alexandra Guerrero Valle","number":"2209194828","email":"mymuyuyo@gmail.com"}};let current=1;let lang='es';function norm(l){l=(l||'es').toLowerCase();if(l.startsWith('ja'))return'ja';if(l.startsWith('ko'))return'ko';if(l.startsWith('fr'))return'fr';if(l.startsWith('de'))return'de';if(l.startsWith('pt'))return'pt';if(l.startsWith('en'))return'en';return'es'}function esc(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function copyToClipboard(value){const v=String(value).trim();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(v);return v}}catch(e){}const ta=document.createElement('textarea');ta.value=v;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.top='-1000px';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);document.execCommand('copy');document.body.removeChild(ta);return v}function toast(value){document.getElementById('toast').innerHTML=UI[lang].toast+' <span class="pill">'+esc(value)+'</span>'}function row(label,value,canCopy){return '<div class="row"><div><p class="k">'+esc(label)+'</p><p class="v">'+esc(value)+'</p></div>'+(canCopy?'<button class="copy" type="button" data-copy="'+esc(value)+'">'+UI[lang].copy+'</button>':'')+'</div>'}function bindCopy(scope){scope.querySelectorAll('[data-copy]').forEach(btn=>{btn.onclick=async()=>{const copied=await copyToClipboard(btn.getAttribute('data-copy'));btn.textContent=UI[lang].copied;setTimeout(()=>btn.textContent=UI[lang].copy,900);toast(copied)}})}function accountBlock(id){const a=ACCOUNTS[id];return '<p class="k">'+UI[lang].account+' '+id+'</p><p class="v"><b>'+esc(a.bank)+'</b> - '+esc(a.type[lang]||a.type.es)+' - '+esc(a.holder)+'</p><p class="v">'+esc(UI[lang].number)+': '+esc(a.number)+' - '+esc(UI[lang].email)+': '+esc(a.email)+'</p>'}function renderSelected(){const a=ACCOUNTS[current];const selected=document.getElementById('selectedCard');selected.innerHTML='<div class="headerLine"><h2>'+esc(a.bank)+'</h2><span class="badge">'+esc(UI[lang].selected)+'</span></div>'+row(UI[lang].type,a.type[lang]||a.type.es,false)+row(UI[lang].holder,a.holder,false)+row(UI[lang].number,a.number,true)+row(UI[lang].email,a.email,true);bindCopy(selected);document.getElementById('toast').textContent=''}function renderAll(){document.getElementById('allCard').innerHTML='<div class="headerLine"><h2>'+esc(UI[lang].available)+'</h2><span class="badge">'+esc(UI[lang].accounts)+'</span></div><div style="margin-bottom:14px">'+accountBlock(1)+'</div><div>'+accountBlock(2)+'</div>'}function buildWhatsApp(){return [UI[lang].waTitle,'',UI[lang].account+' 1','Banco: '+ACCOUNTS[1].bank,UI[lang].type+': '+(ACCOUNTS[1].type[lang]||ACCOUNTS[1].type.es),UI[lang].holder+': '+ACCOUNTS[1].holder,UI[lang].number+': '+ACCOUNTS[1].number,UI[lang].email+': '+ACCOUNTS[1].email,'',UI[lang].account+' 2','Banco: '+ACCOUNTS[2].bank,UI[lang].type+': '+(ACCOUNTS[2].type[lang]||ACCOUNTS[2].type.es),UI[lang].holder+': '+ACCOUNTS[2].holder,UI[lang].number+': '+ACCOUNTS[2].number,UI[lang].email+': '+ACCOUNTS[2].email].join('\n')}function render(){const t=UI[lang];document.documentElement.lang=lang;document.title=t.title+' - Hostal Muyuyo';document.getElementById('title').textContent=t.title;document.getElementById('sub').textContent=t.sub;document.getElementById('lang-label').textContent=t.lang;document.getElementById('hint').textContent=t.hint;document.getElementById('btnAll').textContent=t.all;document.getElementById('language-select').value=lang;document.getElementById('t1').classList.toggle('active',current===1);document.getElementById('t2').classList.toggle('active',current===2);renderSelected();renderAll();localStorage.setItem('muyuyo-bank-lang',lang)}document.getElementById('language-select').addEventListener('change',e=>{lang=e.target.value;render()});document.getElementById('t1').onclick=()=>{current=1;render()};document.getElementById('t2').onclick=()=>{current=2;render()};document.getElementById('btnAll').onclick=async()=>{await copyToClipboard(buildWhatsApp());toast('WhatsApp')};lang=norm(navigator.language);render();</script><script src="../muyuyo-common.js"></script><script>
/* muyuyo-page-open-impact-counter */
(function(){
  const endpoint='https://muyuyo-impact-counter.mymuyuyo.workers.dev/';
  const card='datos-bancarios';
  const flag='muyuyo-impact-navigation:'+card;
  try{if(sessionStorage.getItem(flag)==='1'){sessionStorage.removeItem(flag);return;}}catch(error){}
  const body=JSON.stringify({page:'menu-principal',card,ts:new Date().toISOString(),ua:navigator.userAgent,lang:navigator.language,source:location.pathname});
  if('sendBeacon' in navigator){
    navigator.sendBeacon(endpoint,new Blob([body],{type:'application/json'}));
  }else{
    fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(()=>{});
  }
})();
</script>
